name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Dependências
        run: |
          sudo apt-get update && sudo apt-get install --yes poppler-utils
          cd web && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Uma release só sai com tudo verde
        run: scripts/testar.sh && scripts/testar-conteiner.sh
      - name: Pacote
        run: scripts/empacotar.sh "$GITHUB_REF_NAME"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # As notas vêm da seção da versão no CHANGELOG.
          awk -v v="$GITHUB_REF_NAME" '$1=="##" {p = ($2==v)} p && $1!="##"' CHANGELOG.md > saida/notas.md
          test -s saida/notas.md || { echo "CHANGELOG.md sem a seção $GITHUB_REF_NAME" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Palantír $GITHUB_REF_NAME" \
            --notes-file saida/notas.md saida/*.tar.gz saida/SHA256SUMS
